name: Prepare PDF libraries for review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download pinned library versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs/pdf
          curl --fail --location --retry 3 --max-time 90 --proto '=https' --tlsv1.2 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js' -o libs/pdf/pdf-lib.min.js
          curl --fail --location --retry 3 --max-time 90 --proto '=https' --tlsv1.2 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js' -o libs/pdf/pdf.min.js
          curl --fail --location --retry 3 --max-time 90 --proto '=https' --tlsv1.2 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js' -o libs/pdf/pdf.worker.min.js
          curl --fail --location --retry 3 --max-time 90 --proto '=https' --tlsv1.2 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' -o libs/pdf/jszip.min.js
          test "$(wc -c < libs/pdf/pdf-lib.min.js)" -gt 100000
          test "$(wc -c < libs/pdf/pdf.min.js)" -gt 100000
          test "$(wc -c < libs/pdf/pdf.worker.min.js)" -gt 100000
          test "$(wc -c < libs/pdf/jszip.min.js)" -gt 10000
          sha512sum libs/pdf/*.js | tee libs/pdf/SHA512SUMS
          printf '%s\n' 'Sources: cdnjs.cloudflare.com; pdf-lib 1.17.1; pdf.js 3.11.174; JSZip 3.10.1' > libs/pdf/SOURCES.txt
      - name: Save for review without deploying
        uses: actions/upload-artifact@v4
        with:
          name: pdf-libraries-review
          path: libs/pdf/
          retention-days: 7
