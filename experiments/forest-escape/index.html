<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forest Escape — 3D Test</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d0c;color:#fff;font:16px system-ui}canvas{display:block}#hud{position:fixed;top:16px;left:16px;z-index:2;text-shadow:0 2px 5px #000}#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;text-align:center;text-shadow:0 2px 5px #000}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;pointer-events:none}#start{position:fixed;inset:0;background:#06100de8;z-index:4;display:grid;place-items:center;text-align:center}button{background:#a3e6b2;color:#092014;border:0;padding:14px 24px;border-radius:9px;font-weight:700;cursor:pointer}small{color:#b6c9c1}
</style></head><body><div id="hud">🌲 FOREST ESCAPE — TEST 0.1<br><span id="status">Găsește cheia aurie și deschide cabana.</span></div><div id="cross">+</div><div id="hint">WASD: mișcare · Mouse: privește · F: lanternă · E: interacțiune · Esc: pauză</div><div id="start"><div><h1>🌲 FOREST ESCAPE</h1><p>Un mic prototip horror 3D, single-player.</p><button id="play">Intră în pădure</button><p><small>Desktop: Chrome / Edge · Click pentru controlul mouse-ului</small></p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x091512);scene.fog=new THREE.FogExp2(0x091512,.035);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,160);camera.position.set(0,1.7,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bc8bb,0x17241c,1.1));const moon=new THREE.DirectionalLight(0x91b3c6,1.1);moon.position.set(-8,18,-12);scene.add(moon);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180),new THREE.MeshStandardMaterial({color:0x263c2c,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const trunkMat=new THREE.MeshStandardMaterial({color:0x493225});const leafMat=new THREE.MeshStandardMaterial({color:0x163d2c});let seed=123456;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<145;i++){const x=(rand()-.5)*120,z=(rand()-.5)*120;if(Math.abs(x)<7&&z>-18&&z<19)continue;const h=3+rand()*4;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.35,h,6),trunkMat);trunk.position.set(x,h/2,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(1.4+rand(),h*1.2,7),leafMat);crown.position.set(x,h+1,z);scene.add(crown)}
const wood=new THREE.MeshStandardMaterial({color:0x4e382b});const roofmat=new THREE.MeshStandardMaterial({color:0x272b2b});const house=new THREE.Mesh(new THREE.BoxGeometry(9,5,8),wood);house.position.set(0,2.5,-19);scene.add(house);const roof=new THREE.Mesh(new THREE.ConeGeometry(7.4,3,4),roofmat);roof.rotation.y=Math.PI/4;roof.position.set(0,6.2,-19);scene.add(roof);
const door=new THREE.Mesh(new THREE.BoxGeometry(2.1,3.6,.22),new THREE.MeshStandardMaterial({color:0x21180f}));door.position.set(0,1.8,-14.88);scene.add(door);
const key=new THREE.Group();const gold=new THREE.MeshStandardMaterial({color:0xffd43b,metalness:.6,roughness:.3,emissive:0x9a6800,emissiveIntensity:.35});const ring=new THREE.Mesh(new THREE.TorusGeometry(.28,.09,8,14),gold);key.add(ring);const stem=new THREE.Mesh(new THREE.BoxGeometry(.13,.65,.13),gold);stem.position.y=-.44;key.add(stem);const tooth=new THREE.Mesh(new THREE.BoxGeometry(.27,.12,.13),gold);tooth.position.set(.09,-.7,0);key.add(tooth);key.position.set(5,1.1,2);scene.add(key);
const light=new THREE.SpotLight(0xfff4c8,25,25,Math.PI/7,.55,1.2);camera.add(light);light.position.set(.2,-.15,0);light.target.position.set(0,-.1,-8);camera.add(light.target);scene.add(camera);let flashlight=true,hasKey=false,won=false,yaw=0,pitch=0;const keys={};const overlay=document.querySelector('#start'),status=document.querySelector('#status');
document.querySelector('#play').onclick=()=>renderer.domElement.requestPointerLock();document.addEventListener('pointerlockchange',()=>{overlay.style.display=document.pointerLockElement===renderer.domElement?'none':'grid'});
document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==renderer.domElement)return;yaw-=e.movementX*.0023;pitch=Math.max(-1.35,Math.min(1.35,pitch-e.movementY*.0023));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyF'&&!e.repeat){flashlight=!flashlight;light.visible=flashlight}if(e.code==='KeyE'&&!e.repeat){if(!hasKey&&camera.position.distanceTo(key.position)<2.6){hasKey=true;scene.remove(key);status.textContent='Ai cheia! Mergi la ușa cabanei.'}else if(hasKey&&camera.position.distanceTo(door.position)<3.6&&!won){won=true;door.rotation.y=-1.2;door.position.x=-.9;status.textContent='🎉 Ai scăpat! Ai terminat prototipul.'}}});document.addEventListener('keyup',e=>keys[e.code]=false);
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(document.pointerLockElement===renderer.domElement){const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const move=new THREE.Vector3();if(keys.KeyW||keys.ArrowUp)move.add(forward);if(keys.KeyS||keys.ArrowDown)move.sub(forward);if(keys.KeyD||keys.ArrowRight)move.add(right);if(keys.KeyA||keys.ArrowLeft)move.sub(right);if(move.lengthSq()){move.normalize().multiplyScalar(dt*(keys.ShiftLeft?7:4));const next=camera.position.clone().add(move);next.x=Math.max(-75,Math.min(75,next.x));next.z=Math.max(-75,Math.min(75,next.z));if(!(next.x>-5.3&&next.x<5.3&&next.z>-23.5&&next.z< -14.5))camera.position.copy(next)}camera.position.y=1.7}if(!hasKey){key.rotation.y+=dt*1.5;key.position.y=1.1+Math.sin(performance.now()*.002)*.14}renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
